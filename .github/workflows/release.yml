name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build CCX
        run: pnpm uxp ccx

      - name: Create release and upload plugin assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find packages/uxp/ccx -type f -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No build artifacts found under packages/uxp/ccx/" >&2
            exit 1
          fi

          gh release upload "$TAG_NAME" "${files[@]}" --clobber
